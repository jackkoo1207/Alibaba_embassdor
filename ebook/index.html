<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Audio Picture Book</title>
<style>
  :root{ --accent:#e8743b; --accent2:#7a5ea8; --shadow:rgba(0,0,0,.35); --ink:#3a2b2b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Trebuchet MS",sans-serif;
    background:radial-gradient(circle at 50% 20%,#2a1f33,#160f1a 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  }
  .stage{perspective:1600px;width:min(94vw,940px)}
  .book{
    position:relative;width:100%;aspect-ratio:128/97;background:#fff8ec;
    border-radius:14px;box-shadow:0 24px 60px var(--shadow);overflow:hidden;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.05,.3,1);
  }
  .book.flipping{transform:rotateY(-16deg) scale(.985)}
  .page{position:absolute;inset:0;display:none}
  .page.active{display:block}

  .media{position:absolute;inset:0;background:#000}
  .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* in-place typed text overlay; each .line is positioned/sized by JS from OCR boxes */
  .overlay{position:absolute;inset:0;pointer-events:none}
  .line{position:absolute;white-space:nowrap;font-family:Georgia,"Times New Roman",serif;
        color:var(--ink);font-weight:600;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .word{opacity:0;transition:opacity .05s}
  .word.show{opacity:1}
  .pnum{position:absolute;font-family:Georgia,"Times New Roman",serif;color:#6b5b4b;
        opacity:.7;font-weight:400;line-height:1}
  .word.caret{position:relative}
  .word.caret::after{content:"";position:absolute;right:-.18em;top:12%;width:.09em;height:.8em;
        background:var(--accent);animation:blink .5s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* static pages */
  .static{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;text-align:center;padding:8% 10%;gap:14px;background:#fff8ec}
  .static h1{font-size:clamp(26px,5vw,52px);color:var(--accent2)}
  .static .sub{font-size:clamp(15px,2.4vw,22px);color:#7a6a5a}
  .static .body{font-size:clamp(15px,2.2vw,20px);max-width:60ch;color:#5a4a3a;line-height:1.5}
  .static .hint{margin-top:8px;font-size:14px;color:#9a8a7a}

  .controls{width:min(94vw,940px);margin-top:16px;display:flex;align-items:center;
            justify-content:space-between;gap:12px;color:#e9d9c9}
  button{font:inherit;border:none;cursor:pointer;border-radius:999px;padding:14px 26px;
         font-size:clamp(15px,2.2vw,19px);font-weight:700;background:var(--accent);color:#fff;
         box-shadow:0 6px 16px rgba(232,116,59,.4);transition:transform .08s,filter .15s}
  button:hover{filter:brightness(1.06)} button:active{transform:translateY(2px)}
  button.ghost{background:rgba(255,255,255,.12);box-shadow:none;color:#e9d9c9}
  button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:9px}.dot{width:11px;height:11px;border-radius:50%;
         background:rgba(255,255,255,.25);cursor:pointer}.dot.on{background:var(--accent);transform:scale(1.25)}
  .meta{display:flex;align-items:center;gap:14px}
  .pageno{font-size:14px;color:#b7a797;min-width:52px;text-align:center}
  .toggle{background:rgba(255,255,255,.12);box-shadow:none;color:#e9d9c9;padding:12px 16px;font-size:14px}
</style>
</head>
<body>
  <div class="stage"><div class="book" id="book"></div></div>
  <div class="controls">
    <button id="prev" class="ghost">&#8592; Back</button>
    <div class="dots" id="dots"></div>
    <div class="meta">
      <span class="pageno" id="pageno"></span>
      <button id="replay" class="toggle">&#128266; Replay</button>
      <button id="next">Start &#10148;</button>
    </div>
  </div>

<script src="data.js"></script>
<script>
const EB=window.EBOOK, book=document.getElementById('book'),
      nextBtn=document.getElementById('next'), prevBtn=document.getElementById('prev'),
      replayBtn=document.getElementById('replay'), dotsEl=document.getElementById('dots'),
      pageno=document.getElementById('pageno');
let idx=0;
const audio=new Audio();

EB.pages.forEach((p,i)=>{
  const el=document.createElement('div'); el.className='page'; el.dataset.i=i;
  if(p.type==='content'){
    const ov=document.createElement('div'); ov.className='overlay';
    (p.layout?.lines||[]).forEach(ln=>{
      const ld=document.createElement('div'); ld.className='line';
      ld.innerHTML=ln.text.split(' ').map(w=>`<span class="word">${w}</span>`).join(' ');
      ov.appendChild(ld);
    });
    (p.layout?.pageNumbers||[]).forEach(pn=>{
      const pd=document.createElement('div'); pd.className='pnum'; pd.textContent=pn.text;
      ov.appendChild(pd);
    });
    el.innerHTML=`<div class="media"><video src="${p.video}" poster="${p.poster||''}" muted loop playsinline preload="auto"></video></div>`;
    el.appendChild(ov);
  } else if(p.type==='cover'){
    el.innerHTML=`<div class="static"><h1>${EB.title}</h1><div class="sub">${p.sub||''}</div><div class="hint">${p.hint||''}</div></div>`;
  } else {
    el.innerHTML=`<div class="static"><h1>${p.heading}</h1><div class="body">${p.body||''}</div></div>`;
  }
  book.appendChild(el);
  const d=document.createElement('span'); d.className='dot'; d.onclick=()=>go(i); dotsEl.appendChild(d);
});

function current(){ return EB.pages[idx]; }

// position + size each typed line from its normalized OCR box, relative to the rendered media
function layoutActive(){
  const p=current(); if(p.type!=='content'||!p.layout) return;
  const media=book.querySelector('.page.active .media'); if(!media) return;
  const r=media.getBoundingClientRect();
  const lines=book.querySelectorAll('.page.active .line');
  lines.forEach((ld,k)=>{
    const b=p.layout.lines[k].box; const [x1,y1,x2,y2]=b;
    ld.style.left=(x1/1000*r.width)+'px';
    ld.style.top =(y1/1000*r.height)+'px';
    const hPx=(y2-y1)/1000*r.height;          // printed line height in px
    ld.style.fontSize=(hPx*0.86)+'px';        // glyph size to match the box
  });
  const pn=book.querySelectorAll('.page.active .pnum');
  (p.layout.pageNumbers||[]).forEach((n,k)=>{
    const el=pn[k]; if(!el) return; const [x1,y1,x2,y2]=n.box;
    el.style.left=(x1/1000*r.width)+'px';
    el.style.top =(y1/1000*r.height)+'px';
    el.style.fontSize=((y2-y1)/1000*r.height*0.9)+'px';
  });
}

// word reveal timing across the whole narration, proportional to character length
function buildSchedule(p){
  const words=[...book.querySelectorAll('.page.active .word')];
  const total=words.reduce((s,w)=>s+w.textContent.length+1,0);
  let acc=0; const sched=[];
  words.forEach(w=>{ sched.push({el:w, start:acc/total}); acc+=w.textContent.length+1; });
  return {words, sched};
}
let raf=null, sched=null;
function startTyping(){
  stopTyping(); const p=current(); if(p.type!=='content') return;
  sched=buildSchedule(p);
  const dur=()=> (audio.duration&&isFinite(audio.duration))?audio.duration:3;
  function tick(){
    if(!audio.paused){
      const frac=Math.min(1, audio.currentTime/dur());
      let lastShown=-1;
      sched.sched.forEach((s,i)=>{ if(frac>=s.start){ s.el.classList.add('show'); lastShown=i; } });
      sched.words.forEach(w=>w.classList.remove('caret'));
      if(lastShown>=0 && lastShown<sched.words.length-1) sched.words[lastShown].classList.add('caret');
      if(frac>=1) sched.words.forEach(w=>w.classList.add('show'));
    }
    raf=requestAnimationFrame(tick);
  }
  tick();
}
function stopTyping(){ if(raf)cancelAnimationFrame(raf); raf=null; }
function resetTyped(){ book.querySelectorAll('.page.active .word').forEach(w=>w.classList.remove('show','caret')); }

function go(n){ n=Math.max(0,Math.min(EB.pages.length-1,n)); if(n===idx){render();return;}
  book.classList.add('flipping'); setTimeout(()=>{ idx=n; render(); book.classList.remove('flipping'); layoutActive(); },250); }

function render(){
  document.querySelectorAll('.page').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('on',i===idx));
  const p=current();
  pageno.textContent=(idx+1)+' / '+EB.pages.length;
  prevBtn.disabled=idx===0;
  nextBtn.innerHTML=idx===EB.pages.length-1?'Restart &#8635;':(p.type==='cover'?'Start &#10148;':'Next &#10148;');
  stopTyping(); resetTyped(); audio.pause();
  if(p.type==='content'){
    layoutActive();
    const v=book.querySelector('.page.active video'); if(v){v.currentTime=0;v.play().catch(()=>{});}
    if(p.audio){ audio.src=p.audio; audio.currentTime=0; audio.muted=false;
      audio.play().then(startTyping).catch(()=>{ /* autoplay blocked: type on replay */ }); }
  }
}

nextBtn.onclick=()=>{ if(idx===EB.pages.length-1) go(0); else go(idx+1); };
prevBtn.onclick=()=>go(idx-1);
replayBtn.onclick=()=>{ const p=current(); if(p.type!=='content')return;
  const v=book.querySelector('.page.active video'); if(v)v.currentTime=0;
  resetTyped(); audio.currentTime=0; audio.play().then(startTyping).catch(()=>{}); };

window.addEventListener('resize',layoutActive);
render();
</script>
</body>
</html>
